name: API Autotests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout autotests
        uses: actions/checkout@v4

      - name: Clone Restful Booker API
        run: git clone https://github.com/mwinteringham/restful-booker.git

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file for CI
        run: |
          echo "ADMIN_USERNAME=admin" > .env
          echo "ADMIN_PASSWORD=password123" >> .env
          echo "BASE_URL=http://api:3001" >> .env

      - name: Run tests in Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from tests

      - name: Generate Allure report
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            -v ${{ github.workspace }}/allure-report:/app/allure-report \
            frankescobar/allure-docker-service:latest \
            allure generate /app/allure-results -o /app/allure-report --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14