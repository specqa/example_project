[pytest]

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -s
    -v
    --alluredir=allure-results
    --tb=short

markers =
    smoke: Тесты для базовой проверки (критические сценарии).
    regression: Тесты для регрессионного тестирования.
    positive: Позитивные тесты (валидные данные).
    negative: Негативные тесты (ошибки, граничные случаи).
    cleanup: Очистка базы данных (запускать отдельно).
    auth: Тесты авторизации.
    get: Тесты GET-запросов.
    post: Тесты POST-запросов.
    put: Тесты PUT-запросов.
    patch: Тесты PATCH-запросов.
    delete: Тесты DELETE-запросов.